[workspace]
resolver = "2"
members = ["crates/gallica", "crates/gallica-core", "crates/gallica-tui", "crates/gallica-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bytes = "1"
futures = "0.3"
quick-xml = "0.37"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
config = { version = "0.15", default-features = false, features = ["toml"] }
directories = "6"
clap = { version = "4", features = ["derive", "wrap_help"] }
indicatif = "0.18"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tracing = "0.1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
